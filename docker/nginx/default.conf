map $request_method $mymedia_write_key {
    POST $binary_remote_addr;
    default "";
}

# Plesk/Apache termina SSL y envía X-Forwarded-Proto. Sin esto PHP ve HTTP
# y Symfony genera canónicas/sitemap en http:// y cookies sin Secure.
map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https   on;
}

limit_req_zone $mymedia_write_key zone=mymedia_write:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=mymedia_ingest:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;

    client_max_body_size 64M;

    # Plesk ya redirige apex → www; esto evita el bucle si el Host llega sin www.
    if ($host = lavozeconomica.com) {
        return 301 https://www.lavozeconomica.com$request_uri;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /api/v1/ingest/himtecmedia {
        limit_req zone=mymedia_ingest burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/(contacto|boletin/suscribir|buscar|cuenta/registro|cuenta/reenviar-verificacion)$ {
        limit_req zone=mymedia_write burst=8 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
    }

    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
